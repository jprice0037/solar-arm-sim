<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Solar Arm Simulation</title>
  <style>
    body {
      margin: 0;
      background: #e9eef3;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #startScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(20, 20, 20, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 10;
    }

    #startScreen h1 {
      font-size: 42px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    #startButton {
      padding: 14px 32px;
      font-size: 20px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.25s;
    }

    #startButton:hover {
      background: #45a049;
      transform: scale(1.05);
    }

    #controls {
      margin: 10px;
      padding: 12px 20px;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.15);
    }

    canvas {
      border: 1px solid #333;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0px 2px 10px rgba(0,0,0,0.2);
    }

    .key {
      display: inline-block;
      padding: 2px 6px;
      margin: 0 2px;
      border: 1px solid #999;
      border-radius: 3px;
      background: #eee;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- Start Screen -->
  <div id="startScreen">
    <h1>Solar Arm Simulation</h1>
    <button id="startButton">Start Simulation</button>
  </div>

  <!-- Controls -->
  <div id="controls">
    <strong>Controls</strong><br>
    <span class="key">←</span><span class="key">→</span> Move arm horizontally<br>
    <span class="key">↑</span><span class="key">↓</span> Move arm vertically<br>
    <span class="key">C</span> Toggle clamp<br>
    <span class="key">6</span><span class="key">7</span><span class="key">8</span><span class="key">9</span> Module count<br>
    <span class="key">L</span> Increase tube length &nbsp;
    <span class="key">K</span> Decrease tube length
  </div>

  <canvas id="simCanvas" width="1400" height="800"></canvas>

  <script>
    const canvas = document.getElementById("simCanvas");
    const ctx = canvas.getContext("2d");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    // Colors
    const WHITE = "#FFFFFF";
    const GRAY = "#C8C8C8";
    const DARK_GRAY = "#555";
    const BLUE = "#3A6DFF";
    const GREEN = "#4CAF50";
    const RED = "#D64545";
    const BLACK = "#000";

    // Arm + Track parameters
    const trackY = HEIGHT / 2;
    let armX = WIDTH / 2;
    let armY = HEIGHT / 2;
    const armWidth = 40;
    const armHeight = 200;

    // Clamp parameters
    const clampWidth = 60;
    const clampHeight = 40;
    let clampOpen = false;

    // Torque tube + module assembly
    let tubeLength = 900;
    const tubeHeight = 20;
    const moduleWidth = 80;
    const moduleHeight = 50;
    let moduleCount = 6;

    // Movement speeds
    const TRACK_SPEED = 6;
    const LIFT_SPEED = 4;

    const keys = {};
    let simulationRunning = false;

    document.getElementById("startButton").onclick = () => {
      document.getElementById("startScreen").style.display = "none";
      simulationRunning = true;
    };

    window.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;

      if (!simulationRunning) return;

      if (e.key.toLowerCase() === "c") clampOpen = !clampOpen;

      if (e.key === "6") moduleCount = 6;
      if (e.key === "7") moduleCount = 7;
      if (e.key === "8") moduleCount = 8;
      if (e.key === "9") moduleCount = 9;

      if (e.key.toLowerCase() === "l" && tubeLength < 1300) tubeLength += 100;
      if (e.key.toLowerCase() === "k" && tubeLength > 600) tubeLength -= 100;
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    function drawTrack() {
      ctx.fillStyle = DARK_GRAY;
      ctx.fillRect(0, trackY - 10, WIDTH, 20);
    }

    function drawArm() {
      ctx.fillStyle = BLUE;
      ctx.fillRect(armX, armY - armHeight / 2, armWidth, armHeight);
    }

    function drawClamp() {
      const clampX = armX + armWidth;
      const clampY = armY - clampHeight / 2;

      ctx.strokeStyle = RED;
      ctx.fillStyle = RED;

      if (clampOpen) {
        ctx.lineWidth = 3;
        ctx.strokeRect(clampX, clampY, clampWidth, clampHeight);
      } else {
        ctx.fillRect(clampX, clampY, clampWidth, clampHeight);
      }
    }

    function drawTorqueTube() {
      if (clampOpen) return;

      const tubeX = armX + armWidth + clampWidth;
      const tubeY = armY - tubeHeight / 2;

      ctx.fillStyle = GREEN;
      ctx.fillRect(tubeX, tubeY, tubeLength, tubeHeight);

      const spacing = tubeLength / moduleCount;
      ctx.fillStyle = GRAY;

      for (let i = 0; i < moduleCount; i++) {
        const mx = tubeX + i * spacing;
        const my = tubeY - moduleHeight;
        ctx.fillRect(mx, my, moduleWidth, moduleHeight);
      }
    }

    function update() {
      if (!simulationRunning) return;

      if (keys["arrowleft"]) armX -= TRACK_SPEED;
      if (keys["arrowright"]) armX += TRACK_SPEED;
      if (keys["arrowup"]) armY -= LIFT_SPEED;
      if (keys["arrowdown"]) armY += LIFT_SPEED;

      const margin = 50;
      if (armX < margin) armX = margin;
      if (armX > WIDTH - margin - armWidth - clampWidth - tubeLength)
        armX = WIDTH - margin - armWidth - clampWidth - tubeLength;

      if (armY < margin) armY = margin;
      if (armY > HEIGHT - margin) armY = HEIGHT - margin;
    }

    function draw() {
      ctx.fillStyle = WHITE;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      drawTrack();
      drawArm();
      drawClamp();
      drawTorqueTube();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
